<style>

  --bg:#F6F5EF; --surface:#FFFFFF; --surface-2:#EFEEE6; --surface-3:#E7E6DC;

  --accent:#2F6B4F; --accent-ink:#245840; --accent-soft:#E2EFE7; --on-accent:#FFFFFF;
  --warn:#8C6210; --warn-soft:#F6EEDA;
  --crit:#A03528; --crit-soft:#F8E7E3;
  --info:#2F5F80; --info-soft:#E2EDF4;
  --shadow:0 1px 2px rgba(26,33,28,.07);
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121613; --surface:#1A201C; --surface-2:#222924; --surface-3:#2A322C;
    --ink:#E9EBE5; --ink-soft:#C6CBC3; --muted:#949D95; --line:#2C332E; --line-2:#3C443E;
    --accent:#77C298; --accent-ink:#8FD3AC; --accent-soft:#1E2F26; --on-accent:#0F1A14;
    --warn:#E0AC58; --warn-soft:#31281A;
    --crit:#E38B79; --crit-soft:#33211E;

    --shadow:0 1px 2px rgba(0,0,0,.35);

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}

/* gate (setup / unlock) */
.gate{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 40px}
.gate-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.gate-card .hd{padding:20px 20px 4px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}

nav{display:flex;gap:2px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}

.banner{border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;max-width:100%}

textarea{width:100%;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.5;resize:vertical}
label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}

tr.rowlink{cursor:pointer}

td.plot{white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-weight:500}

.pill.due{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}

.hint{color:var(--muted);font-size:12.5px;line-height:1.55}

dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-family:"IBM Plex Mono",monospace;word-break:break-all}

.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;width:100%;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.25)}

.smslist{display:grid;gap:10px}

.smscard .hd .tel{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted)}
.smscard pre{margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.5;color:var(--ink-soft);background:var(--surface-2);border-radius:7px;padding:8px 10px}

.prev{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f5f5f7}
.prev iframe{width:100%;height:520px;border:0;display:block;background:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:80;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}

@media (max-width:760px){
  .top{position:static}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1/-1}
  .grid2{grid-template-columns:1fr}

  .hm{display:none}
  td.nm{max-width:150px}

<body>
<div id="root"></div>
<script>
"use strict";
/* ============================================================================
   Žiburėlis kasa — SB Žiburėlis nario mokesčių apskaita.
   Šiame faile NĖRA sodininkų duomenų. Duomenys saugomi privačioje GitHub
   repozitorijoje kaip užšifruotas failas (AES-256-GCM, raktas iš slaptažodžio per
   PBKDF2-SHA256, 600 000 iteracijų) ir iššifruojami tik naršyklėje.
   ========================================================================== */

const DEFAULTS = { owner:"aleksandrassukovas-hub", dataRepo:"ziburelis-duomenys", dataPath:"data.enc.json",
                   pubRepo:"ziburelis-skolos", pubPath:"index.html" };
const ITER = 600000;
const IDLE_MS = 15*60*1000;
const DEV_KEY = "zk.device.v1";

/* Sklypų išdėstymas plane (koordinatės viešo puslapio SVG). Ne asmens duomenys. */
const GEO = {
 "6-27":[0,0],"6-25":[50,0],"6-23":[100,0],"6-21":[150,0],"6-19":[200,0],"6-17":[250,0],"6-15":[300,0],
 "6-13":[374,0],"6-11":[424,0],"6-9":[474,0],"6-7":[524,0],"6-5":[574,0],"6-3":[624,0],
 "6-30":[0,74],"6-28":[100,74],"6-26":[150,74],"6-24":[200,74],"6-22":[250,74],"6-20":[300,74],
 "6-18":[374,74],"6-14":[424,74],"6-12":[424,118],"6-10":[474,74],"6-8":[524,74],"6-6":[574,74],"6-4":[624,74],"6-2":[674,74],
 "7-23":[0,176],"7-21":[100,176],"7-19":[150,176],"7-17":[200,176],"7-15":[250,176],"7-13":[300,176],
 "7-11":[374,176],"7-9":[424,176],"7-7":[474,176],"7-5-1":[524,176],"7-5":[574,176],"7-3":[624,176],"7-1":[624,220]
};
const DEFAULT_SMS = "Sveiki, primenu apie SB Žiburėlis nario mokestį už {metai} m.\nSklypas Rudausių sodų {sklypas} — liko mokėti {skola} Eur (kartu su skola už ankstesnį laikotarpį).\nPatikslinti galite čia: {nuoroda}\nSumokėti galite pavedimu: {gavejas}, {iban}, arba grynais adresu {grynais}. Mokėjimo paskirtyje įrašykite savo sklypo adresą.\nDėkoju!";

/* ---------------- būsena ---------------- */
let screen = "setup";           // setup | unlock | app
let dev = null;                 // įrenginio nustatymai: repozitorijos + užšifruotas raktas
let token = null;               // GitHub raktas — tik atmintyje ir tik kol atrakinta
let dataKey = null, dataSalt = null, dataIter = ITER, dataSha = null;
let plots = [], payments = [], settings = {};
let tab = "skolos", filter = "all", q = "", staged = null;
/* rūšiavimas pagal stulpelius: k — raktas, d — kryptis (1 didėjanti, -1 mažėjanti) */
const SORT_DEFAULT = { skolos:{k:null,d:1}, kontaktai:{k:null,d:1}, journal:{k:"date",d:-1} };
let sorts = JSON.parse(JSON.stringify(SORT_DEFAULT));
const NUM_KEYS = new Set(["mokestis","apSkola","paid","due","amount","date"]);
let dirty = false, saving = null, saveTimer = null, conflict = false, saveErr = "", lastSaved = null;
let lastActive = Date.now();

/* ---------------- pagalbinės funkcijos ---------------- */
const te = new TextEncoder(), td = new TextDecoder();
const el = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => { const v=Math.round((Number(n)||0)*100)/100; return Number.isInteger(v)?String(v):v.toFixed(2).replace(".",","); };
const p2 = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); };
const stamp = () => { const d=new Date(); return today()+" "+p2(d.getHours())+":"+p2(d.getMinutes()); };
const newId = () => "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------------- šifravimas ---------------- */
function b64e(bytes){ const b=new Uint8Array(bytes); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function b64d(str){ const s=atob(String(str||"").replace(/\s/g,"")); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:iter}, base, {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]);
}
async function seal(key, salt, iter, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv:iv}, key, te.encode(JSON.stringify(obj)));
  return {format:"ziburelis-kasa-enc",v:1,alg:"AES-256-GCM",kdf:{name:"PBKDF2",hash:"SHA-256",iter:iter,salt:b64e(salt)},iv:b64e(iv),ct:b64e(ct)};
}
async function unseal(key, env){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(env.iv)}, key, b64d(env.ct));
  return JSON.parse(td.decode(pt));
}
function envOk(env){ return env && env.format==="ziburelis-kasa-enc" && env.kdf && env.kdf.salt && env.iv && env.ct; }

/* ---------------- GitHub ---------------- */
class GhError extends Error{ constructor(code,msg,status){ super(msg); this.code=code; this.status=status; } }
async function gh(method, url, body, tok){
  let res;
  try{
    res = await fetch("https://api.github.com"+url, {
      method: method, cache: "no-store",
      headers: Object.assign({Authorization:"Bearer "+(tok||token), Accept:"application/vnd.github+json"}, body?{"Content-Type":"application/json"}:{}),
      body: body?JSON.stringify(body):undefined
    });
  }catch(e){ throw new GhError("network","Nėra ryšio su GitHub. Patikrinkite internetą ir bandykite dar kartą."); }
  return res;
}
const repoUrl = (repo) => "/repos/"+encodeURIComponent(dev.owner)+"/"+encodeURIComponent(repo);
const fileUrl = (repo,path) => repoUrl(repo)+"/contents/"+String(path).split("/").map(encodeURIComponent).join("/");
async function ghFail(res){
  if(res.status===401) return new GhError("auth","GitHub nepriėmė prieigos rakto: jis nebegalioja, atšauktas arba įvestas su klaida.",401);
  if(res.status===403){
    let m=""; try{ m=(await res.json()).message||""; }catch(_){}
    if(/rate limit/i.test(m)) return new GhError("rate","GitHub laikinai apribojo užklausas. Palaukite kelias minutes.",403);
    return new GhError("perm","Raktas neturi teisių šiam veiksmui (reikia Contents: Read and write).",403);
  }
  if(res.status===404) return new GhError("notfound","Nerasta: patikrinkite vartotojo vardą, repozitorijos pavadinimą ir rakto prieigą prie jos.",404);
  if(res.status===409 || res.status===422) return new GhError("conflict","Failas GitHub pasikeitė nuo įkėlimo.",res.status);
  return new GhError("http","GitHub grąžino klaidą "+res.status+".",res.status);
}
async function repoExists(repo, tok){
  const r = await gh("GET", repoUrl(repo), null, tok);
  if(r.ok){ const j = await r.json(); return {ok:true, private:!!j.private}; }
  if(r.status===404) return {ok:false};
  throw await ghFail(r);
}
async function getFile(repo, path, tok){
  const r = await gh("GET", fileUrl(repo,path), null, tok);
  if(r.status===404) return null;
  if(!r.ok) throw await ghFail(r);
  const j = await r.json();
  return {sha:j.sha, text: td.decode(b64d(j.content||""))};
}
async function putFile(repo, path, text, sha, message, tok){
  const body = {message:message, content:b64e(te.encode(text))};
  if(sha) body.sha = sha;
  const r = await gh("PUT", fileUrl(repo,path), body, tok);
  if(!r.ok) throw await ghFail(r);
  const j = await r.json();
  return j.content.sha;
}

/* ---------------- įrenginio nustatymai ---------------- */
function loadDev(){ try{ const j = JSON.parse(localStorage.getItem(DEV_KEY)||"null"); return (j && j.tok) ? j : null; }catch(_){ return null; } }
function saveDev(d){ try{ localStorage.setItem(DEV_KEY, JSON.stringify(d)); return true; }catch(_){ return false; } }
function forgetDev(){ try{ localStorage.removeItem(DEV_KEY); }catch(_){} }

/* ---------------- duomenų tvarkymas ---------------- */
function normalize(j){
  if(!j || !Array.isArray(j.plots) || !Array.isArray(j.payments)) throw new Error("Failas nepanašus į Žiburėlis kasa eksportą: nėra sklypų ir mokėjimų sąrašų.");
  const P = j.plots.map(p=>{
    if(!p || !p.id || !p.street || p.nr==null) throw new Error("Faile yra sklypas be numerio arba gatvės.");
    return {id:String(p.id), street:String(p.street), nr:String(p.nr), mokestis:Number(p.mokestis)||0, apSkola:Number(p.apSkola)||0,
            name:p.name||"", phone:p.phone||"", name2:p.name2||"", phone2:p.phone2||"", email:p.email||"", note:p.note||""};
  });
  const ids = new Set(P.map(p=>p.id));
  const Y = j.payments.map(p=>{
    const alloc = {}; for(const k of Object.keys(p.alloc||{})){ if(!ids.has(k)) throw new Error("Mokėjimas „"+(p.descr||"")+"“ priskirtas neegzistuojančiam sklypui "+k+"."); alloc[k]=Number(p.alloc[k])||0; }
    return {id:String(p.id||newId()), date:String(p.date||""), descr:String(p.descr||""), amount:Number(p.amount)||0, alloc:alloc};
  });
  const s = Object.assign({year:new Date().getFullYear(), payee:"", iban:"", cash:"", publicUrl:"", smsTemplate:DEFAULT_SMS}, j.settings||{});
  s.year = Number(s.year)||new Date().getFullYear();
  return {settings:s, plots:P, payments:Y};
}
function snapshot(){ return {format:"ziburelis-kasa-data", v:1, savedAt:new Date().toISOString(), settings:settings, plots:plots, payments:payments}; }
function wipe(){ token=null; dataKey=null; dataSalt=null; dataSha=null; plots=[]; payments=[]; settings={}; staged=null; dirty=false; conflict=false; saveErr=""; }

async function doConnect(){
  setupErr("");
  const tok = el("s_tok").value.trim(), pw = el("s_pw").value;
  const cfg = readRepoFields();
  if(!tok || !pw) return setupErr("Reikia rakto ir slaptažodžio.");
  if(!cfg.owner || !cfg.dataRepo) return setupErr("Reikia vartotojo vardo ir privačios repozitorijos pavadinimo.");
  busy("setupGo", true, "Tikrinama…");
  try{
    dev = Object.assign({}, cfg);
    const f = await getFile(cfg.dataRepo, cfg.dataPath, tok);
    if(!f) throw new Error("Duomenų failas nerastas. Patikrinkite repozitorijos pavadinimą ir ar raktas turi prie jos prieigą. Jei saugyklos dar nėra — skirtukas „Sukurti saugyklą“.");
    let env; try{ env = JSON.parse(f.text); }catch(_){ env=null; }
    if(!envOk(env)) throw new Error("Repozitorijoje esantis failas nėra užšifruota Žiburėlis kasa saugykla.");
    busy("setupGo", true, "Tikrinamas slaptažodis…");
    const salt = b64d(env.kdf.salt), iter = env.kdf.iter||ITER;
    const key = await deriveKey(pw, salt, iter);
    let data; try{ data = await unseal(key, env); }catch(_){ throw new Error("Neteisingas slaptažodis."); }
    const n = normalize(data);
    const tSalt = crypto.getRandomValues(new Uint8Array(16));
    const tKey = await deriveKey(pw, tSalt, ITER);
    dev.tok = await seal(tKey, tSalt, ITER, {token:tok});
    if(!saveDev(dev)) throw new Error("Naršyklė neleido išsaugoti nustatymų (privatus režimas?). Prisijungimas veiks tik iki kortelės uždarymo.");
    token = tok; dataKey = key; dataSalt = salt; dataIter = iter; dataSha = f.sha;
    settings = n.settings; plots = n.plots; payments = n.payments;
    lastSaved = null; screen = "app"; tab = "skolos"; render(); toast("Įrenginys prijungtas");
  }catch(e){
    dev = loadDev();
    setupErr(e.message||String(e)); busy("setupGo", false, "Prijungti");
  }
}

async function doCreate(){
  setupErr("");
  const tok = el("s_tok").value.trim(), pw = el("s_pw").value, pw2 = el("s_pw2").value;
  const file = el("s_file").files && el("s_file").files[0];
  const cfg = readRepoFields();
  if(!tok) return setupErr("Reikia GitHub prieigos rakto.");
  if(pw.length < 12) return setupErr("Slaptažodis trumpesnis nei 12 simbolių. Patikimiausia — 4–5 atsitiktiniai žodžiai iš eilės.");
  if(pw !== pw2) return setupErr("Slaptažodžiai nesutampa.");
  if(!file) return setupErr("Pasirinkite JSON duomenų failą.");
  if(!cfg.owner || !cfg.dataRepo) return setupErr("Reikia vartotojo vardo ir privačios repozitorijos pavadinimo.");
  busy("setupGo", true, "Tikrinama repozitorija…");
  try{
    dev = Object.assign({}, cfg);
    let n; try{ n = normalize(JSON.parse(await file.text())); }catch(e){ throw new Error(e instanceof SyntaxError ? "Failas neatpažįstamas kaip JSON." : e.message); }
    const repo = await repoExists(cfg.dataRepo, tok);
    if(!repo.ok) throw new Error("Repozitorija „"+cfg.dataRepo+"“ nerasta arba raktas neturi prie jos prieigos.");
    if(!repo.private) throw new Error("Repozitorija „"+cfg.dataRepo+"“ yra vieša. Duomenims reikia privačios — pakeiskite Settings → Danger Zone → Change visibility.");
    const exist = await getFile(cfg.dataRepo, cfg.dataPath, tok);
    if(exist) throw new Error("Repozitorijoje jau yra saugykla. Naudokite „Prijungti įrenginį“ — perrašyti jos iš čia negalima.");
    busy("setupGo", true, "Šifruojama…");
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(pw, salt, ITER);
    settings = n.settings; plots = n.plots; payments = n.payments;
    const env = await seal(key, salt, ITER, snapshot());
    busy("setupGo", true, "Siunčiama…");
    const sha = await putFile(cfg.dataRepo, cfg.dataPath, JSON.stringify(env), null, "kasa: sukurta saugykla "+stamp(), tok);
    const tSalt = crypto.getRandomValues(new Uint8Array(16));
    const tKey = await deriveKey(pw, tSalt, ITER);
    dev.tok = await seal(tKey, tSalt, ITER, {token:tok});
    saveDev(dev);
    token = tok; dataKey = key; dataSalt = salt; dataIter = ITER; dataSha = sha;
    lastSaved = new Date(); screen = "app"; tab = "skolos"; render();
    toast("Saugykla sukurta. Ištrinkite JSON failą iš kompiuterio, jei jo nebereikia.");
  }catch(e){
    wipe(); dev = loadDev();
    setupErr(e.message||String(e)); busy("setupGo", false, "Užšifruoti ir sukurti");
  }
}

/* duomenų failo įkėlimas ir iššifravimas; pw reikia tik jei pasikeitė failo druska */
async function loadRemote(pw){
  const f = await getFile(dev.dataRepo, dev.dataPath);
  if(!f) throw new Error("Duomenų failas dingo iš repozitorijos „"+dev.dataRepo+"“. Atkurkite jį iš GitHub pakeitimų istorijos.");
  const env = JSON.parse(f.text);
  if(!envOk(env)) throw new Error("Duomenų failas sugadintas arba neužšifruotas.");
  const fileSalt = b64d(env.kdf.salt), iter = env.kdf.iter||ITER;
  let key = dataKey;
  if(!key || !sameBytes(fileSalt, dataSalt)){
    if(!pw) throw new GhError("relock","Slaptažodis pakeistas kitame įrenginyje — prisijunkite iš naujo.");
    key = await deriveKey(pw, fileSalt, iter);
  }
  let data; try{ data = await unseal(key, env); }catch(_){ throw new Error("Slaptažodis netinka duomenų failui. Jei slaptažodis buvo pakeistas kitame įrenginyje — „Prijungti iš naujo“."); }
  const n = normalize(data);
  dataKey = key; dataSalt = fileSalt; dataIter = iter; dataSha = f.sha;
  settings = n.settings; plots = n.plots; payments = n.payments;
  dirty = false; conflict = false; saveErr = "";
}
function sameBytes(a,b){ if(!a||!b||a.length!==b.length) return false; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }

/* ============================================================================
   IŠSAUGOJIMAS
   ========================================================================== */
function touch(){ dirty = true; saveErr = ""; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); renderSync(); }
async function flush(){
  clearTimeout(saveTimer);
  if(saving){ await saving; if(dirty && !conflict) return flush(); return; }
  if(!dirty || conflict || !dataKey) return;
  dirty = false; renderSync("saving");
  saving = (async()=>{
    try{
      const env = await seal(dataKey, dataSalt, dataIter, snapshot());
      dataSha = await putFile(dev.dataRepo, dev.dataPath, JSON.stringify(env), dataSha, "kasa: "+stamp());
      lastSaved = new Date(); saveErr = "";
    }catch(e){
      dirty = true;
      if(e.code==="conflict") conflict = true; else saveErr = e.message||"Išsaugojimo klaida";
    }
  })();
  await saving; saving = null;
  renderSync(); renderBanner();
  if(dirty && !conflict && !saveErr) return flush();
}
function renderSync(state){
  const d = el("syncDot"), t = el("syncTxt"); if(!d||!t) return;
  let k="ok", txt = lastSaved ? "išsaugota "+p2(lastSaved.getHours())+":"+p2(lastSaved.getMinutes()) : "įkelta";
  if(state==="saving"){ k="busy"; txt="saugoma…"; }
  else if(conflict){ k="bad"; txt="konfliktas"; }
  else if(saveErr){ k="bad"; txt="neišsaugota"; }
  else if(dirty){ k="busy"; txt="yra pakeitimų"; }
  d.className = "dot "+k; t.textContent = txt;
}
function renderBanner(){
  const b = el("banner"); if(!b) return;
  if(conflict){
    b.className="banner crit"; b.hidden=false;
    b.innerHTML = '<span>Duomenys pasikeitė kitame įrenginyje, todėl paskutiniai pakeitimai čia neišsaugoti.</span>'
      + '<button class="btn sm" id="bReload">Įkelti naujausius duomenis (čia padaryti pakeitimai dings)</button>';
    el("bReload").onclick = async()=>{ try{ await loadRemote(); lastSaved=null; renderAll(); toast("Įkelti naujausi duomenys"); }catch(e){ if(e.code==="relock") return lockNow(e.message); toast(e.message); } };
  } else if(saveErr){
    b.className="banner warn"; b.hidden=false;
    b.innerHTML = '<span>'+esc(saveErr)+'</span><button class="btn sm" id="bRetry">Bandyti išsaugoti dar kartą</button>';
    el("bRetry").onclick = ()=>{ saveErr=""; flush(); };
  } else { b.hidden=true; b.innerHTML=""; }
}

/* grįžus į kortelę įkeliami naujausi duomenys (telefonas ↔ kompiuteris) */
async function refreshIfChanged(manual){
  if(screen!=="app" || dirty || saving || conflict) { if(manual && dirty) toast("Palaukite, kol bus išsaugota"); return; }
  try{
    const r = await gh("GET", fileUrl(dev.dataRepo, dev.dataPath));
    if(!r.ok) throw await ghFail(r);
    const j = await r.json();
    if(j.sha === dataSha){ if(manual) toast("Duomenys naujausi"); return; }
    await loadRemote(); renderAll(); toast("Įkelti pakeitimai iš kito įrenginio");
  }catch(e){ if(e.code==="relock") return lockNow(e.message); if(manual) toast(e.message); }
}

async function lockNow(msg){
  if(dirty || saving){ await flush(); }
  if(dirty && !msg){ if(!confirm("Yra neišsaugotų pakeitimų. Vis tiek užrakinti? Jie dings.")) return; }
  wipe(); screen = dev ? "unlock" : "setup";
  if(screen==="unlock") renderUnlock(msg); else render();
}

  if(document.visibilityState!=="visible" || screen!=="app") return;

function paidOf(id){ let s=0; for(const p of payments){ if(p.alloc && p.alloc[id]) s+=Number(p.alloc[id])||0; } return Math.round(s*100)/100; }
function geoOrder(p){ const g=GEO[p.id]; return g ? g[1]*1000+g[0] : 99999; }
function rows(){
  return plots.map(p=>{
    const paid = paidOf(p.id);
    const due = Math.round(((Number(p.mokestis)||0)+(Number(p.apSkola)||0)-paid)*100)/100;
    return Object.assign({},p,{paid:paid,due:due});
  }).sort((a,b)=> a.street===b.street ? geoOrder(a)-geoOrder(b) || a.nr.localeCompare(b.nr,undefined,{numeric:true}) : a.street.localeCompare(b.street));
}
function totals(){
  const r = rows();
  const charged = r.reduce((s,x)=>s+(Number(x.mokestis)||0)+(Number(x.apSkola)||0),0);
  const paid = r.reduce((s,x)=>s+x.paid,0);
  const debtors = r.filter(x=>x.due>0);
  return {charged:charged,paid:paid,left:charged-paid,clean:r.filter(x=>x.due<=0).length,n:r.length,
          debtors:debtors.length,debtSum:debtors.reduce((s,x)=>s+x.due,0)};
}

/* ---------------- rūšiavimas ---------------- */
const plotKey = x => x.street+" "+String(x.nr).split("-").map(n=>n.padStart(4,"0")).join("-");
function sortBy(view, arr, acc){
  const st = sorts[view]; const f = st.k && acc[st.k]; if(!f) return arr;
  return arr.slice().sort((a,b)=>{
    const x=f(a), y=f(b); let c;
    const ex = x===""||x==null, ey = y===""||y==null;
    if(ex!==ey) return ex ? 1 : -1;                      // tušti laukai visada gale
    if(typeof x==="number" && typeof y==="number") c = x-y;
    else c = String(x==null?"":x).localeCompare(String(y==null?"":y), "lt", {numeric:true, sensitivity:"base"});
    if(c===0 && a.street && b.street) c = plotKey(a).localeCompare(plotKey(b));
    return c*st.d;
  });
}
function sth(view, key, label, cls){
  const st = sorts[view], on = st.k===key;
  return '<th class="sortable'+(cls?' '+cls:'')+'" data-view="'+view+'" data-key="'+key+'" tabindex="0" aria-sort="'+(on?(st.d>0?"ascending":"descending"):"none")+'" title="Rūšiuoti">'+esc(label)+'<span class="arr">'+(on?(st.d>0?"▲":"▼"):"")+'</span></th>';
}
function bindSort(root, rerender){
  root.querySelectorAll("th.sortable").forEach(th=>{
    const go = ()=>{
      const view = th.dataset.view, key = th.dataset.key, st = sorts[view];
      const first = NUM_KEYS.has(key) ? -1 : 1;           // skaičiai ir datos — nuo didžiausio

function restage(){ staged.forEach(s=>{ if(!s.bad) s.dup=isDup(s); }); renderStage(); }
function statusPill(s){
  if(s.bad) return '<span class="pill due">eilutė neatpažinta</span>';
  if(s.dup) return '<span class="pill warn">jau žurnale</span>';
  if(!Object.keys(s.alloc).length) return '<span class="pill due">sklypas nenustatytas</span>';
  if(s.guess) return '<span class="pill cred">pagal pavardę — patikrinkite</span>';
  return '<span class="pill ok">paruošta</span>';
}
function isDup(s){ return payments.some(p=>p.date===s.date && Math.abs((+p.amount||0)-s.amount)<0.005 && (p.descr||"").trim()===(s.descr||"").trim()); }
function split(ids,amount){
  const a={}; if(!ids.length) return a;
  const each = Math.round((amount/ids.length)*100)/100;
  ids.forEach((id,i)=> a[id] = i===ids.length-1 ? Math.round((amount-each*(ids.length-1))*100)/100 : each);
  return a;
}
function allocSmart(ids,amount){
  if(!ids.length) return {};
  const r = rows();
  const dues = ids.map(id=>{ const x=r.find(p=>p.id===id); return x?x.due:0; });
  const sum = dues.reduce((s,d)=>s+d,0);
  if(ids.length>1 && dues.every(d=>d>0) && Math.abs(sum-amount)<0.005){ const a={}; ids.forEach((id,i)=>a[id]=dues[i]); return a; }
  return split(ids,amount);
}
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase(); }
function findPlots(descr){
  const ids=[]; const d=descr||"";
  const re=/\b([67])\s*-\s*(\d+(?:-\d+)?)((?:\s*,\s*\d+(?:-\d+)?)+)?/g; let m;
  while((m=re.exec(d))){
    const st=m[1]; const first=st+"-"+m[2];
    if(plots.some(p=>p.id===first) && !ids.includes(first)) ids.push(first);
    if(m[3]) m[3].split(",").map(x=>x.trim()).filter(Boolean).forEach(nr=>{ const id=st+"-"+nr; if(plots.some(p=>p.id===id) && !ids.includes(id)) ids.push(id); });
  }
  if(ids.length) return {ids:ids,guess:false};
  const D=norm(d);
  const hits=plots.filter(p=>(norm(p.name)+" "+norm(p.name2)).split(/[^A-Z]+/).filter(t=>t.length>=5).some(t=>new RegExp("\\b"+t+"\\b").test(D))).map(p=>p.id);
  return {ids:hits,guess:hits.length>0};
}
function parseStatement(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const out=[]; const hdr=lines[0].toLowerCase();
  let cols=null, iA=-1, iD=-1, iT=-1;
  if(hdr.includes("amount") && (hdr.includes("description") || hdr.includes("completed"))){
    cols = splitCsv(lines[0]).map(c=>c.trim().toLowerCase());
    iA = cols.findIndex(c=>c==="amount"); iD = cols.findIndex(c=>c==="description");
    iT = cols.findIndex(c=>c.includes("completed date")); if(iT<0) iT = cols.findIndex(c=>c.includes("date"));
    if(iA<0 || iD<0) cols=null;
  }
  for(let i=cols?1:0;i<lines.length;i++){
    const line = lines[i];
    if(cols){
      const c = splitCsv(line); const extra = c.length - cols.length;
      if(extra===0 || (extra>0 && iD<iA)){
        const amt = Number(String(c[iA+(extra>0?extra:0)]||"").replace(/[\s ]/g,"").replace(",","."));
        const descr = extra>0 ? c.slice(iD, iD+extra+1).join(",").trim() : (c[iD]||"").trim();
        if(isFinite(amt) && amt>0) out.push(mk(pickDate(c[iT]||""), descr, amt));
        continue;
      }
      out.push({date:today(), descr:line, amount:0, alloc:{}, guess:false, dup:false, take:false, bad:true});
      continue;
    }
    const r = parseLoose(line); if(r) out.push(r);
  }
  return out;
}
function parseLoose(line){
  const amtM = line.match(/(?:^|[\s,;|])(-?\d+(?:[.,]\d{1,2})?)\s*(?:EUR|€)?\s*$/);
  if(!amtM) return null;
  const amt = Number(amtM[1].replace(",","."));
  if(!isFinite(amt) || amt<=0) return null;
  let rest = line.slice(0, amtM.index + amtM[0].indexOf(amtM[1])).trim().replace(/[\t;|]+/g," ").trim();
  const dM = rest.match(/(\d{4}-\d{2}-\d{2}|\d{1,2}[./]\d{1,2}[./]\d{2,4})/);
  const date = pickDate(dM?dM[1]:"");
  if(dM) rest = (rest.slice(0,dM.index)+" "+rest.slice(dM.index+dM[1].length)).trim();
  return mk(date, rest.replace(/^[\s,;]+|[\s,;]+$/g,"").replace(/\s{2,}/g," "), amt);
}
function mk(date,descr,amt){
  const r = findPlots(descr); const a = Math.round(amt*100)/100;
  const s = {date:date||today(), descr:descr, amount:a, alloc:allocSmart(r.ids,a), guess:r.guess};
  s.dup = isDup(s); s.take = !s.dup && r.ids.length>0; return s;
}
function pickDate(s){
  s=String(s||"").trim(); let m;
  if((m=s.match(/(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  if((m=s.match(/(\d{1,2})[./](\d{1,2})[./](\d{4})/))) return m[3]+"-"+p2(m[2])+"-"+p2(m[1]);
  if((m=s.match(/(\d{1,2})[./](\d{1,2})[./](\d{2})$/))) return "20"+m[3]+"-"+p2(m[2])+"-"+p2(m[1]);
  return "";
}
function splitCsv(line){
  const out=[]; let cur="", inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(inQ && line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
    else if((ch===","||ch===";"||ch==="\t") && !inQ){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur); return out;
}
function commitStaged(){
  const take = (staged||[]).filter(s=>s.take && s.amount>0 && !s.bad && Object.keys(s.alloc).length);
  if(!take.length) return toast("Nėra ką įrašyti");
  for(const s of take) payments.push({id:newId(), date:s.date, descr:s.descr, amount:s.amount, alloc:s.alloc});
  staged = (staged||[]).filter(s=>!take.includes(s)); if(!staged.length) staged=null;
  touch(); renderAll(); toast("Įrašyta: "+take.length);
}

      if(!/^[67]-oji$/.test(st) || !nr){ toast("Gatvė — 6-oji arba 7-oji, numeris privalomas"); return false; }

/* apsauga: joks sodininko vardas, telefonas ar el. paštas negali patekti į viešą failą */
function findLeaks(html){
  const H = norm(html), hits = new Set();
  for(const p of plots){
    for(const ph of [p.phone,p.phone2]){ const dg=String(ph||"").replace(/\D/g,""); if(dg.length>=8 && html.includes(dg.slice(-8))) hits.add(p.id+": telefonas"); }
    if(p.email && H.includes(norm(p.email))) hits.add(p.id+": e-mail");
    for(const tkn of (norm(p.name)+" "+norm(p.name2)).split(/[^A-Z]+/).filter(t=>t.length>=5)){
      if(new RegExp("(^|[^A-Z])"+tkn+"([^A-Z]|$)").test(H)) hits.add(p.id+": vardas „"+tkn+"“");
    }
  }
  return Array.from(hits);
}

  el("dlMok").onclick = ()=>downloadCsv("Mokestis-"+settings.year+".csv", ["Gatve","Nr","Vardas","Mokėti","AP skola","Sumokėta","Skola"], rows().map(x=>[x.street,x.nr,x.name,x.mokestis,x.apSkola,x.paid,x.due]));

async function publishPublic(){
  const html = publicHtml(); const leaks = findLeaks(html);
  if(leaks.length) return toast("Paskelbimas užblokuotas: rasta asmens duomenų");
  if(!confirm("Paskelbti skolų puslapį? Jį mato visi, turintys nuorodą: sklypų numeriai ir sumos, be vardų.")) return;
  busy("pub", true, "Skelbiama…");
  try{
    const cur = await getFile(dev.pubRepo, dev.pubPath);
    if(cur && cur.text === html){ toast("Svetainėje jau ši versija"); return; }
    await putFile(dev.pubRepo, dev.pubPath, html, cur?cur.sha:null, "Skolų lentelė atnaujinta "+today());
    toast("Paskelbta. Svetainė atsinaujins per 1–2 minutes");
  }catch(e){ toast(e.code==="notfound" ? "Viešoji repozitorija nerasta arba raktas neturi prie jos prieigos" : e.message); }
  finally{ busy("pub", false, "Paskelbti svetainėje"); }
}

function changePassword(){
  modal("Keisti slaptažodį",
    f("Dabartinis slaptažodis","cp_old","password","")+'<div style="margin-top:10px">'+f("Naujas slaptažodis (ne trumpesnis nei 12 simbolių)","cp_new","password","")+'</div><div style="margin-top:10px">'+f("Pakartokite naują slaptažodį","cp_new2","password","")+'</div>'
    + '<p class="hint" style="margin:10px 0 0">Kituose įrenginiuose po pakeitimo reikės „Prijungti iš naujo“ — rakto ir naujo slaptažodžio.</p>',
    async ()=>{
      const o=el("cp_old").value, n=el("cp_new").value, n2=el("cp_new2").value;
      if(n.length<12){ toast("Naujas slaptažodis trumpesnis nei 12 simbolių"); return false; }
      if(n!==n2){ toast("Nauji slaptažodžiai nesutampa"); return false; }
      try{ const tk = await deriveKey(o, b64d(dev.tok.kdf.salt), dev.tok.kdf.iter||ITER); await unseal(tk, dev.tok); }
      catch(_){ toast("Neteisingas dabartinis slaptažodis"); return false; }
      if(dirty || saving) await flush();
      if(conflict || dirty){ toast("Pirmiausia sutvarkykite neišsaugotus pakeitimus"); return false; }
      try{
        const salt = crypto.getRandomValues(new Uint8Array(16)); const key = await deriveKey(n, salt, ITER);
        const env = await seal(key, salt, ITER, snapshot());
        const sha = await putFile(dev.dataRepo, dev.dataPath, JSON.stringify(env), dataSha, "kasa: pakeistas slaptažodis "+stamp());
        dataKey=key; dataSalt=salt; dataIter=ITER; dataSha=sha; lastSaved=new Date();
        const tSalt = crypto.getRandomValues(new Uint8Array(16)); const tKey = await deriveKey(n, tSalt, ITER);
        dev.tok = await seal(tKey, tSalt, ITER, {token:token}); saveDev(dev);
        renderAll(); toast("Slaptažodis pakeistas");
      }catch(e){ toast(e.code==="conflict"?"Duomenys pasikeitė kitame įrenginyje — atnaujinkite ir pakartokite":e.message); return false; }
    });
}

  const s = document.createElement("div"); s.className="scrim";
  s.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="panel-hd"><h2>'+esc(title)+'</h2></div><div class="panel-bd">'+body+'</div>'
    + '<div class="panel-bd" style="border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" data-x>Atšaukti</button><button class="btn pri" data-ok>Išsaugoti</button></div></div>';
  document.body.appendChild(s);
  const close=()=>{ s.remove(); document.removeEventListener("keydown",onKey); };
  const onKey=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",onKey);
  s.querySelector("[data-x]").onclick=close;
  s.addEventListener("click", e=>{ if(e.target===s) close(); });
  const ok = s.querySelector("[data-ok]");
  ok.onclick = async()=>{ ok.disabled=true; try{ const r = await onSave(); if(r!==false) close(); } finally{ ok.disabled=false; } };
  const first = s.querySelector("input,textarea"); if(first) first.focus();
}
let toastT;
function toast(msg){
  let t = document.querySelector(".toast");
  if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3200);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("Nukopijuota"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Nukopijuota"); }catch(_){ toast("Nepavyko nukopijuoti"); } ta.remove();
  }
}
function download(name, data, type){
  const b = new Blob([data], {type:type||"application/octet-stream"}); const u = URL.createObjectURL(b);
  const a = document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 1500);
}
function downloadCsv(name, header, rowsArr){
  const cell = s => '"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  download(name, "﻿"+[header].concat(rowsArr).map(r=>r.map(cell).join(",")).join("\r\n"), "text/csv;charset=utf-8");
}

  dev = loadDev();
  screen = dev ? "unlock" : "setup";
  render();
})();
